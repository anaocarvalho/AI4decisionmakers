# JobScout configuration — edit freely; validated at startup (packages/core/src/config.ts).

search:
  # A posting's TITLE must contain at least one of these (case-insensitive).
  title_keywords:
    - data analyst
    - economic analyst
    - economist
    - economics
    - econometric
    - research analyst
    - research assistant
    - research associate
    - policy analyst
    - quantitative analyst
    - statistical analyst
    - analytics
    - junior fellow      # e.g. Carnegie junior fellows
    - research fellow
    - researcher
    - quantitative researcher
    - data scientist
    - consulting analyst
    - consulting associate # economic consulting (CRA, Analysis Group, Cornerstone…)
    - business analyst
    - risk analyst
    - credit analyst
    - pricing analyst
    - strategy analyst
    - market research
    - survey
  # Titles containing any of these are dropped (seniority / wrong field).
  title_exclude:
    - senior
    - sr.
    - sr
    - lead
    - principal
    - staff
    - director
    - manager
    - head of
    - vice president
    - vp
    - chief
    - iii
    - iv
    - software engineer
    - postdoc
    - postdoctoral
    - professor
    - faculty
  include_internships: true        # CPT-eligible internships
  max_years_experience: 2          # drop postings whose minimum required experience exceeds this
  max_age_days: 45                 # drop postings first published longer ago than this
  # Free-text queries used by keyword APIs (Adzuna, JSearch, USAJobs).
  queries:
    - entry level data analyst
    - economic analyst
    - research assistant economics
    - policy analyst
    - econometrics analyst
    - research analyst think tank

locations:
  remote_us: true
  cities:
    - name: New York, NY
      aliases: [new york, nyc, manhattan, brooklyn, queens, bronx, staten island]
  # "Remote" postings mentioning any of these are treated as non-US and dropped.
  non_us_markers:
    - canada
    - united kingdom
    - uk
    - europe
    - emea
    - apac
    - latam
    - india
    - germany
    - mexico
    - brazil
    - australia
    - philippines
    - ireland
    - netherlands
    - spain
    - poland

scoring:
  model: claude-haiku-5-5          # cheapest per token; scores are short JSON
  max_jobs_per_run: 150            # hard budget cap on Claude calls per run
  highlight_threshold: 70          # "high fit" cutoff for the UI and weekly digest
  sponsorship_penalty: 40          # subtracted from fit when a posting says no sponsorship / citizens only / clearance

tailoring:
  # Used by the Netlify function (one call each time you click "Draft"). The function can't read this
  # file at runtime, so it defaults to the same value; override with the TAILOR_MODEL Netlify env var.
  model: claude-opus-5-5

sources:
  # Public employer job boards (no API key). Token = the slug in the board URL, e.g.
  # job-boards.greenhouse.io/<token>, jobs.lever.co/<token>, jobs.ashbyhq.com/<token>.
  # Verified 2026-11-19. Most think tanks on the starter list (Brookings, Urban, RAND, Mathematica,
  # Abt, NBER, PIIE, CBPP, EPI, BPC, AEI, Cato, CFR, Carnegie, NY Fed, MDRC, Analysis Group,
  # Cornerstone Research, NERA, Compass Lexecon, Moody's, S&P, Bloomberg) use Workday/iCIMS/Taleo,
  # which have no public API. They are covered by the Adzuna/JSearch sources (Milestone 5).
  greenhouse:
    enabled: true
    boards:
      - { company: Charles River Associates, token: charlesriverassociates }
      - { company: American Institutes for Research, token: americaninstitutesforresearch }
      - { company: GiveWell, token: givewell }
      - { company: Affirm, token: affirm }
      - { company: Chime, token: chime }
      - { company: Upstart, token: upstart }
  lever:
    enabled: true
    boards:
      - { company: FiscalNote, token: fiscalnote }
  ashby:
    enabled: true
    boards:
      - { company: IDinsight, token: idinsight }
      - { company: Morning Consult, token: morningconsult }
      - { company: NerdWallet, token: nerdwallet }
  # Keyword APIs: each runs every search.queries entry in NYC and as remote.
  # They are skipped automatically until their keys exist as GitHub Secrets.
  adzuna:
    enabled: true                  # needs ADZUNA_APP_ID + ADZUNA_APP_KEY (free: developer.adzuna.com)
    results_per_query: 50
  jsearch:
    enabled: true                  # needs RAPIDAPI_KEY; free tier ≈ 200 requests/month → 8/day, rotating queries
    max_queries_per_run: 8
  usajobs:
    enabled: false                 # needs USAJOBS_API_KEY + USAJOBS_EMAIL; federal roles require US citizenship
