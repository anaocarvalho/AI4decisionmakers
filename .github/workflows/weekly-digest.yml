name: Weekly digest
on:
  schedule:
    - cron: "40 12 * * 1"   # Mondays 12:40 UTC (after the daily fetch)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Post digest issue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBSCOUT_OWNER_ID: ${{ secrets.JOBSCOUT_OWNER_ID }}
          JOBSCOUT_SITE_URL: ${{ vars.JOBSCOUT_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run digest
