# Netlify configuration. File values override the UI's build settings.
# Base directory must be empty (repo root) in Project configuration → Build & deploy.

[build]
  command = "npm run build"          # builds web/ (tests + typecheck run in GitHub Actions CI)
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# `netlify dev` → http://localhost:8888 serves the Vite app and the functions together, with env vars.
[dev]
  framework = "#custom"
  command = "npm run dev -w @jobscout/web"
  targetPort = 5173
  port = 8888

# Single-page app: unknown paths (e.g. the magic-link return URL) serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
