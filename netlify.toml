# Netlify build configuration. Values here override the UI's build settings.
# Milestone 6 replaces the placeholder with the React app (publish = "web/dist", functions, SPA redirect).

[build]
  # Tests and typecheck run in GitHub Actions CI on every push/PR; Netlify only builds the site.
  command = "node --version && npm --version && echo 'placeholder site, nothing to build yet'"
  publish = "web/public"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
